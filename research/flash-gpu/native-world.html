<!doctype html><meta charset="utf-8"><style>html,body{margin:0;background:#484955;overflow:hidden}#game-container{position:absolute;inset:0}object{width:100vw;height:100vh}</style>
<div id="game-container"><object id="DungeonBlitz" width="1600" height="900" type="application/x-shockwave-flash" data="/fixture.swf"><param name="movie" value="/fixture.swf"><param name="allowScriptAccess" value="always"><param name="wmode" value="transparent"></object></div>
<script type="module">
import {GpuSession} from '/gpu/session.mjs';
import {pixelSuite} from '/pixels.mjs';
const sleep=ms=>new Promise(r=>setTimeout(r,ms)),plugin=document.getElementById('DungeonBlitz');
const RealWorker=window.Worker;window.Worker=class extends RealWorker{postMessage(message,...args){super.postMessage(message,...args);if(message?.channel==='blitz-gpu-render-v1'&&message.action==='frame'&&window.__stopAfterFrame){const stop=window.__stopAfterFrame;window.__stopAfterFrame=null;setTimeout(stop,0);}}};
window.runProbe=async()=>{
 console.log('Owned probe started');
 for(let i=0;i<150;i++){await sleep(100);const state=typeof plugin.BlitzRenderState==='function'?plugin.BlitzRenderState():null;if(state?.fixture?.loadError||state?.fixture?.snapshotError)throw Error(JSON.stringify(state));if(state?.fixture?.hotbar!==undefined)break;}
 console.log('Owned fixture ready');if(typeof plugin.BlitzTransitionFixtureControl!=='function')throw Error('Offline game fixture failed to initialize');
 plugin.BlitzSetWidescreen(true);plugin.BlitzTransitionFixtureControl(true,false);plugin.BlitzWorldFixtureControl(250,true,false,false,250,false,'a_Room_Main');await sleep(1500);
 const sample=async(name,ms)=>{const begin=performance.now(),first=plugin.PerfState(),latencies=[];while(performance.now()-begin<ms){const at=performance.now();const s=plugin.PerfEcho(name+' native dialogue '+Math.round(at));if(s.worldError)throw Error(s.worldError);latencies.push(performance.now()-at);await sleep(50);}const last=plugin.PerfState(),elapsed=performance.now()-begin;latencies.sort((a,b)=>a-b);return {name,elapsedMs:elapsed,nativeFrames:last.frames-first.frames,nativeFPS:(last.frames-first.frames)*1000/elapsed,echoP50:latencies[Math.floor(latencies.length*.5)],echoP95:latencies[Math.floor(latencies.length*.95)],echoMax:latencies[latencies.length-1]};};
 const baseline=await sample('Original',5000),statuses=[];console.log('Baseline '+JSON.stringify(baseline));let phase='',gpuSamples=[];const workerURL=URL.createObjectURL(new Blob([window.__ownedGpuResources.worker],{type:'text/javascript'}));const session=new window.__ownedGpuClass({cap:1000,nativeFlash:true,workerURL,artWorkerSource:window.__ownedGpuResources.art,verified:()=>true,onStatus:s=>{if(s.phase!==phase||s.reason){statuses.push({...s});console.log('GPU status '+JSON.stringify(s));phase=s.phase;}if(s.phase==='gpu')gpuSamples.push({...s});}});window.fixtureSession=session;await session.start();for(let i=0;i<200&&session.status.phase!=='gpu';i++)await sleep(100);if(session.status.phase!=='gpu'){await session.stop();throw Error('GPU activation failed: '+JSON.stringify(statuses));}
 const active=await sample('GPU + native game',10000),gpu={...session.status},structure=plugin.BlitzGpuStructure();
 if(active.nativeFPS<baseline.nativeFPS*.9||active.echoP95>Math.max(8,baseline.echoP95*1.5)||gpu.completedCanvasFPS<120)throw Error('Native UI cadence or changing GPU throughput regressed');
 if(!Number.isFinite(gpu.sourceSnapshotsFPS)||gpu.sourceSnapshotsFPS<15)throw Error('Source snapshot rate unavailable or stalled');
 const capStart=await session.current.cap(240);await sample('240 world cap',3000);const capEnd=await session.current.cap(240),capRate=(capEnd.completedFrames-capStart.completedFrames)*1000/(capEnd.elapsedMs-capStart.elapsedMs);if(capRate>248||capRate<80)throw Error('Measured GPU cap failed: '+capRate);await session.current.cap(1000);
 const proof=async name=>{window.__ownedProofSaved='';console.log('OWNED_PROOF_'+name);for(let i=0;i<100&&window.__ownedProofSaved!=='OWNED_PROOF_'+name;i++)await sleep(10);if(!window.__ownedProofSaved)throw Error('Owned capture failed');};
 plugin.PerfFreeze(true);plugin.PerfEcho('Native dialogue pixel parity');await sleep(400);await proof('gpu');await session.stop();await sleep(200);await proof('original');const restored=await sample('Restored Original',2000);
 const cycles=[];for(let cycle=0;cycle<5;cycle++){await session.start();for(let i=0;i<100&&session.status.phase!=='gpu';i++)await sleep(50);if(session.status.phase!=='gpu')throw Error('Repeated activation failed');await sleep(100);await session.stop();if(session.quarantined||document.querySelectorAll('canvas').length)throw Error('Repeated shutdown retained a GPU worker/canvas');cycles.push({cycle,stopped:true});}
 const interrupted=new Promise(resolve=>{window.__stopAfterFrame=()=>{void session.stop().then(resolve);};});await session.start();await Promise.race([interrupted,new Promise((_,reject)=>setTimeout(()=>reject(Error('Pending-frame shutdown timed out')),8000))]);if(session.quarantined||document.querySelectorAll('canvas').length)throw Error('Pending-frame shutdown leaked resources');
 await session.start();for(let i=0;i<100&&session.status.phase!=='gpu';i++)await sleep(100);if(session.status.phase!=='gpu')throw Error('GPU restart failed');plugin.BlitzSetWidescreen(false);await sleep(1500);if(!plugin.BlitzGpuNativeView(false).supported)throw Error('Resize lost native view');await sleep(500);await proof('resized');await session.stop();URL.revokeObjectURL(workerURL);const pixels=await pixelSuite();
 return {status:'pass',baseline,active,restored,gpu,statuses,structure,pixels,cycles,interruptedFrameStop:true,cap240:{completedWorldRendersPerSecond:capRate},limits:['Original native artwork/HUD/camera fixture in the transparent host, no live gameplay or account','Source snapshots, native update FPS and interpolated GPU world renders are separate metrics; scanout is unmeasured']};
};
</script>
