<!doctype html><meta charset="utf-8"><style>html,body{margin:0;background:#204060;overflow:hidden}canvas,object{position:absolute;left:0;top:0;width:1000px;height:720px}canvas{z-index:0}object{z-index:1}</style>
<canvas id="world"></canvas><object id="Probe" width="1000" height="720" type="application/x-shockwave-flash" data="/fixture.swf"><param name="movie" value="/fixture.swf"><param name="allowScriptAccess" value="always"><param name="wmode" value="transparent"></object>
<script>
window.runProbe=async()=>{
 const plugin=document.getElementById('Probe'),sleep=ms=>new Promise(r=>setTimeout(r,ms));for(let i=0;i<100&&typeof plugin.PerfState!=='function';i++)await sleep(100);if(typeof plugin.PerfState!=='function')throw Error('Flash fixture not initialized');
 const sample=async(name,duration)=>{const start=plugin.PerfState(),begin=performance.now(),latencies=[];while(performance.now()-begin<duration){const at=performance.now();plugin.PerfEcho(name+' native UI response '+Math.round(at));latencies.push(performance.now()-at);await sleep(30);}const end=plugin.PerfState(),elapsed=performance.now()-begin;latencies.sort((a,b)=>a-b);return {name,elapsedMs:elapsed,flashFrames:end.frames-start.frames,flashFPS:(end.frames-start.frames)*1000/elapsed,nativeElapsed:end.time-start.time,echoP50:latencies[Math.floor(latencies.length*.5)],echoP95:latencies[Math.floor(latencies.length*.95)],echoMax:latencies[latencies.length-1]};};
 await sleep(1000);const baseline=await sample('baseline',4000);if(plugin.querySelector('param[name="wmode"]').value==='direct')return {status:'pass',mode:'direct',baseline,scope:'Synthetic native Flash control, stage target 100, no game/account'};const worker=new Worker('/worker.js'),canvas=document.querySelector('canvas').transferControlToOffscreen();let stats;const ready=new Promise((resolve,reject)=>{worker.onmessage=({data})=>{if(data.error)reject(Error(data.error));else if(data.ready)resolve(data);else stats=data;};worker.onerror=reject;});worker.postMessage({canvas},[canvas]);const info=await ready;const active=await sample('Flash plus GPU worker',6000);worker.postMessage({stop:true});await sleep(100);worker.terminate();return {status:'pass',info,baseline,active,gpu:stats,limits:['synthetic Flash animation/UI callbacks, not real NPC gameplay','GPU renders are separate from Flash game updates and display scanout']};
};
</script>
